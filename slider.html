<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owl Slider</title>

    <link rel="stylesheet" href="./owl.carousel.min.css">
    <link rel="stylesheet" href="./owl.theme.default.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
        }

        .owl-carousel {
            width: 100%;
            padding: 30px 50px;
        }

        .owl-carousel .item {
            height: 300px;
            overflow: hidden;
            border-radius: 10px;
        }

        .owl-carousel .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .owl-carousel .owl-nav button.owl-next,
        .owl-carousel .owl-nav button.owl-prev {
            position: absolute;
            top: 40%;
            color: black;
            font-size: 60px;
            background: transparent;
            border: none;
        }

        .owl-carousel .owl-nav button.owl-next {
            right: 10px;
        }

        .owl-carousel .owl-nav button.owl-prev {
            left: 10px;
        }

        .owl-carousel .owl-nav button.owl-next:hover,
        .owl-carousel .owl-nav button.owl-prev:hover {
            background: transparent;
            color: #555;
        }

        .owl-carousel .owl-dots {
            text-align: center;
            margin-top: 15px;
        }

        .owl-carousel .owl-dot span {
            width: 10px;
            height: 10px;
        }
    </style>

</head>
<body>
    <div class="owl-carousel owl-theme">
   <div class="item">
        <img src="ff1.avif" alt="">
    </div>
    <div class="item">
        <img src="ff2.avif" alt="">
    </div>
    <div class="item">
        <img src="ff3.webp" alt="">
    </div>
      <div class="item">
        <img src="ff4.jpg" alt="">
      </div>
      <div class="item">
        <img src="ff5.avif" alt="">
      </div>
      <div class="item">
        <img src="ff6.webp" alt="">
      </div>
        <div class="item">
            <img src="ff7.jpg" alt="">
        </div>
</div>

<script src="./slider.js"></script>
<script src="/owl.carousel.min.js"></script>
<script>
    $('.owl-carousel').owlCarousel({
    loop:true,
    margin:10,
    nav:true,
    responsive:{
        0:{
            items:1
        },
        600:{
            items:3
        },
        1000:{
            items:5
        }
    }
})
</script>
</body>
</html>
